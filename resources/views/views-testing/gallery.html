<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gallery</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap");

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Poppins", sans-serif;
      background: #f9fafb;
      color: #1e293b;
    }

    .gallery-container {
      max-width: 1200px;
      margin: 60px auto;
      padding: 20px;
    }

    .page-title {
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 40px;
      color: #2563eb;
      animation: fadeInDown 0.7s ease;
    }

    /* Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      cursor: pointer;
      transform: scale(0.9);
      opacity: 0;
      transition: 0.5s;
    }
    .gallery-item.show {
      transform: scale(1);
      opacity: 1;
    }

    .gallery-item img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 12px;
      transition: 0.4s;
    }

    /* Hover overlay */
    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: rgba(37, 99, 235, 0.6);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: 0.4s;
      font-size: 18px;
      font-weight: 600;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
      filter: brightness(0.8);
    }
    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    /* Lightbox */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: 0.4s;
      z-index: 9999;
    }
    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
      animation: zoomIn 0.5s ease;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 28px;
      color: #fff;
      cursor: pointer;
    }

    /* Animations */
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<div class="gallery-container">
  <h1 class="page-title">My Gallery</h1>

  <div class="gallery-grid">
    <div class="gallery-item"><img src="https://via.placeholder.com/400x250" alt=""><div class="gallery-overlay">Project 1</div></div>
    <div class="gallery-item"><img src="https://via.placeholder.com/400x250" alt=""><div class="gallery-overlay">Project 2</div></div>
    <div class="gallery-item"><img src="https://via.placeholder.com/400x250" alt=""><div class="gallery-overlay">Project 3</div></div>
    <div class="gallery-item"><img src="https://via.placeholder.com/400x250" alt=""><div class="gallery-overlay">Project 4</div></div>
    <div class="gallery-item"><img src="https://via.placeholder.com/400x250" alt=""><div class="gallery-overlay">Project 5</div></div>
    <div class="gallery-item"><img src="https://via.placeholder.com/400x250" alt=""><div class="gallery-overlay">Project 6</div></div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightboxClose">&times;</span>
  <img src="" alt="preview" id="lightboxImg">
</div>

<script>
  // Reveal on scroll
  const galleryItems = document.querySelectorAll(".gallery-item");
  const revealOnScroll = () => {
    const windowHeight = window.innerHeight;
    galleryItems.forEach((item, i) => {
      const position = item.getBoundingClientRect().top;
      if (position < windowHeight - 100) {
        setTimeout(() => item.classList.add("show"), i * 100);
      }
    });
  };
  window.addEventListener("scroll", revealOnScroll);
  window.addEventListener("load", revealOnScroll);

  // Lightbox
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxClose = document.getElementById("lightboxClose");

  document.querySelectorAll(".gallery-item img").forEach(img => {
    img.addEventListener("click", () => {
      lightbox.classList.add("active");
      lightboxImg.src = img.src;
    });
  });

  lightboxClose.addEventListener("click", () => {
    lightbox.classList.remove("active");
  });

  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
      lightbox.classList.remove("active");
    }
  });
</script>

</body>
</html>
