<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            body {
                margin: 0px;
                padding: 0px;
                background-color: aqua;
            }
            .profile-media {
                position: relative;
                height: 300px;
                width: 500px;
                margin: 50px;
                border-radius: 10px;
            }

            .profile-banner img {
                border: 2px solid green;
                position: absolute;
                object-fit: cover;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .profile-image img {
                object-fit: cover;
                width: 100px;
                height: 100px;
                border: 4px solid black;
                border-radius: 50%;
                /* overflow: hidden; */
                position: absolute;
                bottom: -60px;
                align-items: center;
                left: 50%;
                transform: translateX(-50%);
            }
        </style>
    </head>
    <body>
        <div class="profile-media">
            <div class="profile-banner">
                <img src="12.png" alt="banner" />
            </div>
            <div class="profile-image">
                <img src="1.png" alt="image" />
            </div>
        </div>
    </body>
</html>
