<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Premium Preloader</title>
        <link rel="stylesheet" href="preloader.css" />
    </head>
    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        /* PRELOADER FULL SCREEN */
        .preloader {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #020617, #000);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* WRAPPER */
        .loader-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
        }

        /* LOGO */
        .logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #2563eb, #22c55e);
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            inset: 0;
            margin: auto;
            animation: pulse 1.8s ease-in-out infinite;
            box-shadow: 0 0 40px rgba(37, 99, 235, 0.5);
        }

        /* OUTER RING */
        .ring {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1.4s linear infinite;
        }

        /* ANIMATIONS */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 50px rgba(34, 197, 94, 0.6);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            }
        }

        /* DEMO CONTENT */
        .demo-content {
            min-height: 100vh;
            background: #020617;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
    </style>
    <body>
        <!-- PRELOADER -->
        <div class="preloader">
            <div class="loader-wrapper">
                <div class="logo">IM</div>
                <div class="ring"></div>
            </div>
        </div>

        <!-- PAGE CONTENT (demo) -->
        <section class="demo-content">
            <h1>Your App Loaded 🚀</h1>
        </section>
    </body>
</html>
